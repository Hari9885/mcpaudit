name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: self-dogfood (fixtures must grade as expected)
        run: |
          npm run build
          node dist/cli.js --stdio "node fixtures/good/server.ts" | grep -E "\(A\)"
          node dist/cli.js --stdio "node fixtures/evil/server.ts" | grep -E "\(F\)"
